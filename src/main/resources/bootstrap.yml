app:
  port: ${APP_PORT:8080}
  logging: debug
  name: multitenant-gateway-service
  consul:
    host: consul-service
    port: 8500

server:
  port: ${app.port}

spring:
  application:
    name: ${app.name}
  cloud:
    consul:
      host: ${app.consul.host}
      port: ${app.consul.port}
      discovery:
        prefer-ip-address: true
        tags: eterea,gateway
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: multitenant-core-service
              uri: lb://multitenant-core-service
              predicates:
                - Path=/api/tenant/core/**,/api/unificado/core/**,/api/v1/auth/**

logging:
  level:
    eterea.gateway.api.rest: ${app.logging}
    web: ${app.logging}
    org:
      springframework.cloud.config: ${app.logging}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always